name: PR Checks

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.rs'
      - '.github/workflows/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Rustfmt
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Run Clippy
        shell: bash
        run: |
          set +e

          : > clippy.log
          cargo clippy --all-targets --no-default-features 2>&1 | tee clippy.log
          clippy_status=${PIPESTATUS[0]}

          echo "clippy_status=$clippy_status" >> clippy.log
          if [ "$clippy_status" -ne 0 ]; then
            exit 1
          fi

      - name: Archive Clippy log
        if: always()
        shell: bash
        run: |
          set +e
          tar caf clippy-log.tar.xz clippy.log

      - name: Upload Clippy log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          path: clippy-log.tar.xz
          if-no-files-found: error
          retention-days: 3
          archive: false
          overwrite: true

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Run tests
        shell: bash
        run: |
          set +e

          : > test.log
          echo '=== cargo test --lib ===' | tee -a test.log
          cargo test --lib --no-default-features --no-fail-fast 2>&1 | tee -a test.log
          test_status=${PIPESTATUS[0]}

          echo >> test.log
          echo "test_status=$test_status" | tee -a test.log

          if [ "$test_status" -ne 0 ]; then
            exit 1
          fi

      - name: Archive test log
        if: always()
        shell: bash
        run: |
          set +e
          tar caf test-log.tar.xz test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          path: test-log.tar.xz
          if-no-files-found: error
          retention-days: 3
          archive: false
          overwrite: true

  demo:
    name: Build demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR commit
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Install Linux native dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libasound2-dev \
            libx11-dev \
            libxkbcommon-x11-0 \
            libwayland-dev \
            libxkbcommon-dev

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Build demo
        shell: bash
        run: cargo build --release --no-default-features --features demo --example demo

      - name: Upload generated Cargo.lock
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: generated-cargo-lock
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
          archive: false
          overwrite: true

      - name: Package demo binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 755 target/release/examples/demo dist/verdandi-demo
          cat > dist/README.txt <<'EOF'
          Verdandi interactive demo — Linux x86_64

          Run from a terminal:
            ./verdandi-demo 1234
            ./verdandi-demo 1234 heavy-metal fast
            ./verdandi-demo 1234 legendary-metal

          Presets: mythic-ambient (default), heavy-metal, legendary-metal.
          The optional final argument "fast" changes the pace for metal presets.

          Controls:
            Left/Right  Previous/next seed
            N           Random seed
            1-8         Toggle musical layers
            Up/Down     Adjust intensity (disables automatic intensity)
            A           Toggle automatic intensity
            Space       Pause/resume

          Built for Linux x86_64 on Ubuntu. A working desktop session and audio output
          are required. On Ubuntu, install runtime dependencies if missing:
            sudo apt-get install libasound2t64 libx11-6 libxkbcommon-x11-0 libwayland-client0 libxkbcommon0
          EOF
          tar -cJf verdandi-demo-linux-x86_64.tar.xz -C dist verdandi-demo README.txt

      - name: Upload demo binary
        uses: actions/upload-artifact@v7.0.1
        with:
          name: verdandi-demo-linux-x86_64
          path: verdandi-demo-linux-x86_64.tar.xz
          if-no-files-found: error
          retention-days: 14
          archive: false
          overwrite: true

  update-lockfile:
    name: Commit reduced-feature Cargo.lock
    needs: demo
    if: needs.demo.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Download generated Cargo.lock
        uses: actions/download-artifact@v8.0.1
        with:
          name: Cargo.lock
          path: generated

      - name: Commit lockfile update
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cp generated/Cargo.lock Cargo.lock
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the reduced feature set."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock for minimal Bevy features"
          git push origin "HEAD:$HEAD_BRANCH"
