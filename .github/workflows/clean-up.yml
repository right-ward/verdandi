name: Cleanup workflow runs

on:
  workflow_run:
    workflows:
      - CI/CD
    types:
      - completed

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete previous workflow runs
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Delete previous workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          workflow_names=(
            "CI/CD"
            "PR Checks"
          )

          total_deleted=0

          for workflow_name in "${workflow_names[@]}"; do
            workflow_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/actions/workflows" \
                --paginate \
                --jq ".workflows[] | select(.name == \"$workflow_name\") | .id" |
              sed -n '1p'
            )"

            if [[ -z "$workflow_id" ]]; then
              echo "Could not find workflow: $workflow_name"
              continue
            fi

            echo "=== $workflow_name (id: $workflow_id) ==="

            gh api \
              --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/runs?per_page=100" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id' > runs.txt

            if [[ "$workflow_name" == "CI/CD" ]]; then
              keep_run_id="$CURRENT_RUN_ID"
            else
              keep_run_id="$(head -n 1 runs.txt)"
            fi

            deleted=0
            while read -r run_id; do
              [[ -z "$run_id" ]] && continue
              [[ "$run_id" == "$keep_run_id" ]] && continue

              echo "Deleting workflow run $run_id..."
              gh api \
                --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"

              deleted=$((deleted + 1))
            done < runs.txt

            echo "Deleted $deleted previous $workflow_name runs."
            total_deleted=$((total_deleted + deleted))
          done

          echo "Deleted $total_deleted workflow runs in total."
