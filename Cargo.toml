[package]
name = "verdandi"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
authors = ["right-ward"]
repository = "https://github.com/right-ward/verdandi"
description = "Seeded, layered procedural music for games: engine-agnostic core + Bevy plugin"
publish = true

[features]
default = ["bevy-plugin"]
# The plugin needs only Bevy's asset and audio infrastructure; rendering is the host game's choice.
bevy-plugin = [
    "dep:bevy",
    "bevy/std",
    "bevy/async_executor",
    "bevy/bevy_asset",
    "bevy/bevy_audio",
]
# The interactive demo adds only the 2D renderer, UI, window/input backend, and built-in font.
# It intentionally leaves out Bevy's 3D stack, scene/picking systems, gamepad/clipboard support,
# and encoded audio/image formats because the demo does not use them.
demo = [
    "bevy-plugin",
    "bevy/bevy_input_focus",
    "bevy/bevy_log",
    "bevy/bevy_ui_render",
    "bevy/bevy_winit",
    "bevy/default_font",
    "bevy/multi_threaded",
    "bevy/x11",
    "bevy/wayland",
]

[dependencies]
bevy = { version = "0.20", optional = true, default-features = false }

[[example]]
name = "render_wav"

[[example]]
name = "demo"
required-features = ["demo"]

# Synthesis runs per-sample on the audio thread: unoptimized builds will crackle.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.verdandi]
opt-level = 3

[profile.release]
codegen-units = 10
lto = true
opt-level = "s"
strip = true
